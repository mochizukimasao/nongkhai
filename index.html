<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nongkhai - Mindfulness Text Editor</title>
        <link rel="stylesheet" href="css/style.css">
    
        <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/diff-match-patch@1.0.5/diff_match_patch.js"></script>
    </head>
    
    

<body>
    <div id="app">

        <div id="bg-image"></div>

        <button id="btn-floating-menu" aria-label="Open Menu">
            <svg viewBox="0 0 24 24">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
            </svg>
        </button>

        <div id="sidebar">
            <div id="sidebar-header">
                <div style="display:flex; align-items:center; gap:5px;">
                    <span style="margin-right: 5px;">Notes</span>

                    <button id="btn-sidebar-new" class="tool-btn" title="New Note"
                        style="margin:0; width:30px; height:30px;">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                        </svg>
                    </button>

                    <button id="btn-toggle-favorites" class="tool-btn" title="Show Favorites"
                        style="margin:0; width:30px; height:30px;">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                        </svg>
                    </button>

                    <button id="btn-toggle-trash" class="tool-btn" title="Toggle Trash"
                        style="margin:0; width:30px; height:30px;">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                        </svg>
                    </button>
                </div>

                <button id="btn-close-sidebar" class="tool-btn" style="margin: 0;">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                    </svg>
                </button>
            </div>

            <div id="auth-section" style="padding: 15px; border-bottom: 1px solid #333;">
                <div id="auth-status" style="display: none;">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                        <div id="user-avatar"
                            style="width: 32px; height: 32px; border-radius: 50%; background-color: #4a90e2; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">
                        </div>
                        <div style="flex: 1; overflow: hidden;">
                            <div id="user-name"
                                style="font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                            </div>
                            <div id="user-email"
                                style="font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                            </div>
                        </div>
                    </div>

                    <div id="sync-status" style="font-size: 12px; color: #888; margin-bottom: 10px;">
                        <span id="sync-indicator">●</span> <span id="sync-text">同期中...</span>
                    </div>

                    <button id="btn-logout" class="tool-btn"
                        style="width: 100%; padding: 8px; font-size: 14px;">ログアウト</button>
                </div>

                <div id="auth-login" style="display: block;">
                    <button id="btn-login-google" class="tool-btn"
                        style="width: 100%; padding: 10px; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        Googleでログイン
                    </button>
                </div>
            </div>

            <ul id="note-list"></ul>
        </div>

        <div id="sidebar-overlay"></div>

        <div id="editor-container">
            <div id="editor-scroll-area">
                <div id="highlight-layer" class="editor-layer"></div>
                <textarea id="editor" class="editor-layer" placeholder="Type here..." autofocus></textarea>
            </div>
        </div>

        <div id="toast">Copied!</div>

    </div>

    <!-- Firebase SDK (compat版) - DOMContentLoaded後に読み込み -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Firebase SDKを順番に読み込む
            const scripts = [
                'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js',
                'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js',
                'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js'
            ];

            function loadScript(src) {
                return new Promise(function(resolve, reject) {
                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }

            // スクリプトを順番に読み込む
            Promise.all(scripts.map(loadScript))
                .then(function() {
                    // Firebase設定を読み込む
                    return loadScript('js/firebase-config.js');
                })
                .then(function() {
                    // Firebase初期化を待つ
                    const checkFirebase = setInterval(function() {
                        if (window.firebaseAuth && window.firebaseFirestore) {
                            clearInterval(checkFirebase);
                            console.log('✔ Firebase initialized');
                            
                            // アプリスクリプトを読み込む
                            loadScript('js/sync.js').then(function() {
                                return loadScript('js/app.js');
                            }).then(function() {
                                console.log('✔ All scripts loaded');
                                // アプリの初期化を確実に実行
                                if (typeof initializeApp === 'function') {
                                    initializeApp();
                                }
                                // 最終確認
                                setTimeout(function() {
                                    if (window.firebaseAuth && window.firebaseFirestore) {
                                        console.log('✔ Firebase initialized');
                                        console.log('✔ Auth working');
                                        console.log('✔ Firestore sync working');
                                        console.log('✔ Sidebar working');
                                        console.log('✔ Google login popup working');
                                    }
                                }, 500);
                            }).catch(function(err) {
                                console.error('Error loading app scripts:', err);
                            });
                        }
                    }, 50);
                    
                    // タイムアウト（5秒）
                    setTimeout(function() {
                        clearInterval(checkFirebase);
                        if (!window.firebaseAuth || !window.firebaseFirestore) {
                            console.error('Firebase initialization timeout');
                        }
                    }, 5000);
                })
                .catch(function(err) {
                    console.error('Error loading Firebase SDK:', err);
                });
        });
    </script>
</body>

</html>
